[tool.poetry]
name = "financial-agent"
version = "0.1.0"
description = "Financial AI Agent (Next Best Action) exposed via Telegram, built with FastAPI and LangChain."
authors = ["Financial Agent Team"]
readme = "README.md"
packages = [{ include = "financial_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.2"
langchain = "^0.3.7"
langchain-core = "^0.3.15"
langchain-openai = "^0.2.5"
langgraph = "^0.2.56"
httpx = "^0.27.2"
structlog = "^24.4.0"
redis = "^5.1.1"
python-multipart = "^0.0.12"

[tool.poetry.group.aws]
optional = true

[tool.poetry.group.aws.dependencies]
mangum = "^0.19.0"
boto3 = "^1.35.50"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.1"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
respx = "^0.21.1"
pyyaml = "^6.0.2"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["financial_agent"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langgraph.*",
    "mangum.*",
    "opentelemetry.*",
    "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q --cov=financial_agent --cov-report=term-missing"

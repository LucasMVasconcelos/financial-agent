services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-agent:local
    container_name: financial-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: financial-agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Tunnel de desenvolvimento: expõe a API publicamente para o Telegram
  # alcançar o webhook. Usa um domínio estático (NGROK_DOMAIN) para que a
  # URL não mude a cada restart — diferente de um túnel efêmero (ex.:
  # trycloudflare.com), aqui o setWebhook do Telegram só precisa ser feito
  # uma vez. Ver "Configurar o bot do Telegram" no README.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: financial-agent-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=https://${NGROK_DOMAIN}"
      - "api:8000"
    ports:
      - "4040:4040" # painel local do ngrok (inspecionar requisições recebidas)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

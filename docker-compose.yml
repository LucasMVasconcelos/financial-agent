services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-agent:local
    container_name: financial-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # redis-stack-server (not plain redis:7-alpine): the LangGraph checkpointer
  # (langgraph-checkpoint-redis) indexes checkpoints via RediSearch (the
  # FT.* commands) — plain Redis doesn't have that module, checkpoint
  # save/load fails immediately without it. See "State persistence in
  # Redis" in the README for why this branch needs it and master doesn't.
  # Pinned (not :latest): the :latest tag on Docker Hub was broken at the
  # time this was set up (container exited immediately with
  # "exec format error" even on a matching amd64 host) — 7.4.0-v3 is the
  # last version confirmed working; bump deliberately, don't float it.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: financial-agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Development tunnel: exposes the API publicly so Telegram can reach the
  # webhook. Uses a static domain (NGROK_DOMAIN) so the URL doesn't change
  # on every restart — unlike an ephemeral tunnel (e.g. trycloudflare.com),
  # here Telegram's setWebhook only needs to be done once. See "Configuring
  # the Telegram bot" in the README.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: financial-agent-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=https://${NGROK_DOMAIN}"
      - "api:8000"
    ports:
      - "4040:4040" # local ngrok dashboard (inspect incoming requests)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
